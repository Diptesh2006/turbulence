services:
  - type: web
    name: turbulence-api-demo
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: uvicorn turbulence_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: CNAI_MODE
        value: mock
      - key: API_ACCESS_TOKEN
        generateValue: true
